name: Security maintenance

# Checks that can go bad without any commit: security.txt approaching its
# Expires date, and the dependency audit (a new advisory, a fix for an accepted
# one, an exception reaching its review date). Read-only; it never regenerates
# or commits anything. A failure is visible here and in the Actions list.
# GitHub disables scheduled workflows in public repositories after about 60 days
# without repository activity, so this is a convenience, not a guarantee:
# docs/security-maintenance.md says what to review by hand. No secrets.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-maintenance
  cancel-in-progress: true

jobs:
  security-txt:
    name: security.txt expiry
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # Fails if a generated file differs from security/security-txt.ts or the
      # Expires date is past, in the 30-day renewal window, or too far ahead.
      - name: Check security.txt files and expiry
        run: node security/sync-vercel.mjs --check

  dependency-audit:
    name: dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          browsers: "false"
      - name: Dependency audit (reviewed exceptions only)
        run: pnpm audit:check
