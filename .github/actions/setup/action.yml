name: Set up the workspace
description: >
  pnpm and Node from the repository's own pins (package.json#packageManager and
  .nvmrc), a frozen install, Playwright's Chromium, and a pinned Firefox for the
  WebDriver BiDi origin check. Run after actions/checkout.

inputs:
  browsers:
    description: Install Playwright's Chromium and the pinned Firefox ("false" for jobs that only need the packages).
    default: "true"

outputs:
  firefox-path:
    description: Path of the Firefox executable (the origin check reads it as FIREFOX_BIN).
    value: ${{ steps.firefox.outputs.firefox-path }}

runs:
  using: composite
  steps:
    # Reads the pnpm version from package.json#packageManager.
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    # Node comes from .nvmrc; `cache: pnpm` caches the pnpm store (never
    # node_modules or build output) under a key derived from pnpm-lock.yaml.
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - run: pnpm install --frozen-lockfile
      shell: bash

    # Not cached on purpose: the download is small next to the suite, and an
    # always-fresh install cannot leave a stale browser behind a new Playwright.
    - if: inputs.browsers == 'true'
      run: pnpm exec playwright install --with-deps chromium
      shell: bash

    # security:origins drives Firefox over WebDriver BiDi, so the version is
    # explicit (the runner's own Firefox is not a pinned dependency).
    - id: firefox
      if: inputs.browsers == 'true'
      uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1.7.2
      with:
        firefox-version: 157.0.1
