name: CI

# Validates every PR and every push to main. Vercel remains solely
# responsible for deploying — this workflow never does.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Public, not a secret — same canonical origin used for local production
  # builds (see docs/production-origin.md), so CI validates the site as it
  # actually ships instead of falling back to the localhost dev origin.
  NEXT_PUBLIC_SITE_URL: https://dump.raioviajante.com

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - run: npm ci

      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
