packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  "@parcel/watcher": false
  esbuild: true
  sharp: true
  unrs-resolver: true

# pnpm's default minimumReleaseAge supply-chain policy rejects packages newer
# than its cutoff. These exact versions were reviewed and intentionally
# adopted by the dependency update commit; re-verify before extending.
minimumReleaseAgeExclude:
  - "@astrojs/internal-helpers@0.12.0"
  - "@astrojs/markdown-satteri@0.4.3"
  - astro@7.3.6

# Security overrides. Each pins an upstream-exact version to its patched
# release; remove an entry when the owning package ships the fix.
# - fflate: satori (through @vercel/og) pins 0.7.3 exactly, which has a
#   denial-of-service advisory in unzipSync. 0.7.5 patches the same 0.7 line.
# - sharp: @vercel/og 0.11.1 asks for ^0.34.5, which has libvips/librsvg
#   advisories fixed in 0.35.5. The 75 generated social images were compared
#   byte for byte before and after and are identical. @vercel/og 1.0.3 drops
#   sharp but does not load in Astro's prerender ("Dynamic require of fs"), so
#   it is not used.
# - satori: @vercel/og 0.11.1 pins 0.25.0 exactly, which escapes generated SVG
#   incorrectly (GHSA-wx4j-mvgx-mqwp). 0.33.5 is the patched release; @vercel/og
#   1.0.3 asks for the same version but is not used (see sharp above).
# - zod: chromium-bidi accepts either ^3.25.0 or ^4.0.0, but the lockfile kept
#   vulnerable 3.25.76. 4.6.7 fixes GHSA-mrhx-c7xc-m3w5.
# - minimatch and glob (GHSA-g3hv-75wg-m249, patched in 11.0.1; GHSA-3g3m-2fjr-6pw4,
#   patched in 14.0.2): every consumer of minimatch 9 and 10 (typescript-estree,
#   glob, test-exclude) and of glob 10 and 13 (Jest and its coverage tooling)
#   asks for a vulnerable range, and no release of those packages asks for a
#   patched one. The named `minimatch` and `Minimatch` exports they use exist in
#   11, so the ranges move to the patched releases. minimatch 3.x is not
#   included: eslint-plugin-import, -jsx-a11y and -react call it as a function
#   or through its default export, and 11 provides neither; eslint 9,
#   @eslint/config-array and @eslint/eslintrc share the same 3.x entry. Remove an entry when its owning
#   packages ship the fix.
overrides:
  "fflate@0.7.3": "0.7.5"
  "satori@0.25.0": "0.33.5"
  "sharp@0.34.5": "0.35.5"
  "zod@^3.25.0 || ^4.0.0": "4.6.7"
  "minimatch@>=9.0.0 <11.0.1": "11.0.3"
  "glob@>=9.0.0 <14.0.2": "14.0.3"
